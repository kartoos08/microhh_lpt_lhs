# MicroHH homogeneous-box LPT reference case.
# NOTE: true z-periodicity and 3-D spectral forcing are provided by the
# companion extensions in this package; they are not stock MicroHH switches.

[master]
npx=1
npy=1

[grid]
itot=256
jtot=256
ktot=256
xsize=1.0
ysize=1.0
zsize=1.0
swspatialorder=4

[advec]
swadvec=4
cflmax=0.45

[diff]
swdiff=4
dnmax=0.20

[fields]
visc=1.5e-5
svisc=2.0e-5
slist=s
rndseed=314159
rndamp[u]=1.0e-3
rndamp[v]=1.0e-3
rndamp[w]=1.0e-3
rndamp[s]=0.0

[thermo]
swthermo=0

[force]
swlspres=0

[time]
starttime=0.0
endtime=20.0
savetime=1.0
outputiter=20
adaptivestep=true
rkorder=3

[stats]
swstats=true
sampletime=0.1

# --- custom homogeneous-box extension ---
[homogeneous_box]
periodic_z=true

# --- custom low-wavenumber linear spectral forcing extension ---
[spectral_force]
enabled=true
epsilon=@EPSILON@
kmin=1.0
kmax=2.0
remove_mean=true

# --- experiment controls consumed by the LPT/initializer extension ---
[entrainment]
S_sub=@S_SUB@
N0_cm3=@N0_CM3@
f_ent=@F_ENT@
L0=@L0@
kappa_ccn=@KAPPA_CCN@
S_cloud=0.0
mask_seed=@MASK_SEED@

[lpt]
enabled=true
particle_mode=@PARTICLE_MODE@
np_fixed=12500000
particle_weight=@PARTICLE_WEIGHT@
strict_np=@STRICT_NP@
seed=@PARTICLE_SEED@
G=1.0e-10
rho_l=1000.0
mu_air=1.81e-5
kappa_T=2.0e-5
gravity=false
r_ccn_median=5.0e-8
r_ccn_sigma_g=1.40
r_init_mode=kohler_critical_scaled
r_init_fixed=1.0e-5
kohler_activation_multiplier=20.0
kappa_ccn=@KAPPA_CCN@
interpolation_order=6
chi_gradient_order=4
