# MicroHH-LPT entrainment/mixing template.
# NOTE: this is an extension template, not an unmodified upstream case file.
# The [lpt] and [entrainment] groups must be parsed by the added extension.

[master]
restart = false
npx = 1
npy = 1

[grid]
itot = 256
jtot = 256
ktot = 256
xsize = 1.0
ysize = 1.0
zsize = 1.0
swspatialorder = 4

[time]
starttime = 0.0
endtime = 20.0
savetime = 1.0
outputiter = 100
adaptivestep = true
cflmax = 0.6
dtmax = 1.0e-3

[advec]
# Use the highest-order non-dissipative option available in your pinned MicroHH build.
# Verify the exact token in the selected release/case examples.
scheme = 4

[diff]
# DNS: molecular viscosity/diffusivity, no SGS closure.
swdiff = 2
visc = 1.5e-5

[thermo]
swthermo = moist

[boundary]
# Upstream MicroHH is horizontally periodic. A genuinely tri-periodic box needs
# a z-periodic pressure/boundary extension; do not interpret this file as making
# z periodic in stock MicroHH.
swboundary = periodic_lpt_extension

[forcing]
# Extension hook: low-k linear forcing tuned to target epsilon.
swforcing = spectral_linear_lpt
epsilon_target = 1.0e-3
kforce_min = 1
kforce_max = 2
forcing_tau = 0.25

[scalar]
# Supersaturation scalar s = qv/qsat - 1 (or project-equivalent scalar).
name = s
kappa_T = 2.0e-5

[entrainment]
S_sub = -0.20
f_ent = 0.25
L0 = 0.20
geometry = blob

[lpt]
enabled = true
np = 12500000
population_mode = weighted_fixed_np
N0_cm3 = 200.0
r_ccn_m = 5.0e-8
kappa_ccn = 0.30
kappa_activation = true
T_ref_K = 283.15
G_m2_s = 1.0e-10
interpolation_points = 6
track_chi_local = true
evaporation_floor = dry_radius

[stats]
swstats = true
sampletime = 0.05

[cross]
swcross = false
